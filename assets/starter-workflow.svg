<svg viewBox="0 0 980 660" role="img" aria-label="Remixable Agent Work Lifecycle — Use one next stage; skip optional ceremony when the task is small (lifecycle diagram)" width="980" height="660" xmlns="http://www.w3.org/2000/svg"><style>@font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: local('JetBrains Mono'), local('JetBrainsMono-Regular'); }
