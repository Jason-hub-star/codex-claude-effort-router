        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default"/>
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis"/>
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security"/>
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed"/>
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)"/>

        <!-- Lifecycle bands -->
        <path d="M 72 112 L 908 112" class="a-default" stroke-width="0.8" stroke-dasharray="3,8"/>
        <text x="72" y="100" class="t-dim" font-size="10" font-weight="600">01 / Default path</text>
        <path d="M 72 264 L 908 264" class="a-default" stroke-width="0.8" stroke-dasharray="3,8"/>
        <text x="72" y="252" class="t-dim" font-size="10" font-weight="600">02 / Risk branch</text>
        <path d="M 72 436 L 908 436" class="a-default" stroke-width="0.8" stroke-dasharray="3,8"/>
        <text x="72" y="424" class="t-dim" font-size="10" font-weight="600">03 / Completion verdict</text>

        <!-- Primary lifecycle rail -->
        <path d="M 154 157 L 748 157" class="a-emphasis" stroke-width="2.2" marker-end="url(#arrowhead-emphasis)"/>

        <!-- Transition paths -->
        <path d="M 248 188 L 248 223 Q 248 233 258 233 L 392 233 Q 402 233 402 243 L 402 278" class="a-security" stroke-width="1.1" marker-end="url(#arrowhead-security)"/>
        <path d="M 465 307 L 465 257.5 Q 465 247.5 455 247.5 L 412 247.5 Q 402 247.5 402 237.5 L 402 188" class="a-emphasis" stroke-width="2" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 710 188 L 710 450" class="a-emphasis" stroke-width="2" marker-end="url(#arrowhead-emphasis)"/>

        <!-- States -->
        <rect x="35" y="126" width="118" height="62" rx="7" class="c-mask"/>
        <rect x="35" y="126" width="118" height="62" rx="7" class="c-frontend" stroke-width="1.5"/>
        <text x="45" y="140" class="t-frontend" font-size="7" font-weight="700">01</text>
        <text x="94" y="147" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Morning</text>
        <text x="94" y="163" class="t-muted" font-size="7" text-anchor="middle">recover context</text>
        <text x="94" y="177" class="t-frontend" font-size="7" text-anchor="middle">아침</text>

        <rect x="189" y="126" width="118" height="62" rx="7" class="c-mask"/>
        <rect x="189" y="126" width="118" height="62" rx="7" class="c-security" stroke-width="1.5"/>
        <text x="199" y="140" class="t-security" font-size="7" font-weight="700">02</text>
        <text x="248" y="147" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Aim</text>
        <text x="248" y="163" class="t-muted" font-size="7" text-anchor="middle">compare reality</text>
        <text x="248" y="177" class="t-security" font-size="7" text-anchor="middle">조준</text>

        <rect x="343" y="126" width="118" height="62" rx="7" class="c-mask"/>
        <rect x="343" y="126" width="118" height="62" rx="7" class="c-backend" stroke-width="1.5"/>
        <text x="353" y="140" class="t-backend" font-size="7" font-weight="700">03</text>
        <text x="402" y="147" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Goal</text>
        <text x="402" y="163" class="t-muted" font-size="7" text-anchor="middle">freeze evidence</text>
        <text x="402" y="177" class="t-backend" font-size="7" text-anchor="middle">골</text>

        <rect x="497" y="126" width="118" height="62" rx="7" class="c-mask"/>
        <rect x="497" y="126" width="118" height="62" rx="7" class="c-backend" stroke-width="1.5"/>
        <text x="507" y="140" class="t-backend" font-size="7" font-weight="700">04</text>
        <text x="556" y="147" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Phase Loop</text>
        <text x="556" y="163" class="t-muted" font-size="7" text-anchor="middle">gate each phase</text>
        <text x="556" y="177" class="t-backend" font-size="7" text-anchor="middle">페이즈루프</text>

        <rect x="651" y="126" width="118" height="62" rx="7" class="c-mask"/>
        <rect x="651" y="126" width="118" height="62" rx="7" class="c-security" stroke-width="1.5"/>
        <text x="661" y="140" class="t-security" font-size="7" font-weight="700">05</text>
        <text x="710" y="147" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Audit</text>
        <text x="710" y="163" class="t-muted" font-size="7" text-anchor="middle">confirm evidence</text>
        <text x="710" y="177" class="t-security" font-size="7" text-anchor="middle">감사</text>

        <rect x="339" y="278" width="126" height="58" rx="7" class="c-mask"/>
        <rect x="339" y="278" width="126" height="58" rx="7" class="c-cloud" stroke-width="1.5"/>
        <text x="402" y="299" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Converge</text>
        <text x="402" y="315" class="t-muted" font-size="7" text-anchor="middle">test the crux</text>
        <text x="402" y="325" class="t-cloud" font-size="7" text-anchor="middle">수렴</text>

        <rect x="651" y="450" width="118" height="58" rx="7" class="c-mask"/>
        <rect x="651" y="450" width="118" height="58" rx="7" class="c-database" stroke-width="1.5"/>
        <text x="710" y="471" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Ready to Share</text>
        <text x="710" y="487" class="t-muted" font-size="7" text-anchor="middle">checks passed</text>
        <text x="710" y="497" class="t-database" font-size="7" text-anchor="middle">evidence</text>

        <!-- Transition labels -->
        <rect x="292.05" y="191" width="65.9" height="16" rx="4" class="c-mask"/>
        <text x="325" y="202" class="t-security" font-size="8" text-anchor="middle">costly risk</text>
        <rect x="400.55" y="226.5" width="65.9" height="16" rx="4" class="c-mask"/>
        <text x="433.5" y="237.5" class="t-backend" font-size="8" text-anchor="middle">crux tested</text>


        <!-- Legend -->
        <text x="220" y="542" class="t-primary" font-size="10" font-weight="600">Legend</text>
        <rect x="220" y="554" width="14" height="9" rx="2" class="c-backend" stroke-width="1"/>
        <text x="240" y="562" class="t-muted" font-size="7">active state</text>
        <rect x="325" y="554" width="14" height="9" rx="2" class="c-cloud" stroke-width="1"/>
        <text x="345" y="562" class="t-muted" font-size="7">waiting</text>
        <rect x="415" y="554" width="14" height="9" rx="2" class="c-database" stroke-width="1"/>
        <text x="435" y="562" class="t-muted" font-size="7">terminal success</text>
        <rect x="560" y="554" width="14" height="9" rx="2" class="c-security" stroke-width="1"/>
        <text x="580" y="562" class="t-muted" font-size="7">failure / exit</text>
      </svg>